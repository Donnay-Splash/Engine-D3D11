# Graphics programs the engine can request by name.
# Each stage is "<source>:<entry>", where <source> is an HLSL file in this directory
# without its extension. The shader compiler builds exactly the entries named here.
# Stages may come from different sources.
# Omit "fragment" for depth-only programs.
# Bindings and vertex inputs come from the compiler's reflection output, not from here.

[program]
name = Mesh
vertex = Scene:mesh_vertex
fragment = Scene:mesh_fragment

[program]
name = FillValues
compute = Scene:fill_values
