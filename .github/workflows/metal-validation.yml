name: Metal Validation

on:
  push:
    branches:
      - 'agent-validate/**'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install DXC
        run: |
          curl -fsSL -o vulkan-sdk.zip https://sdk.lunarg.com/sdk/download/latest/mac/vulkan-sdk.zip
          unzip -q vulkan-sdk.zip
          sudo ./vulkansdk-macOS-*.app/Contents/MacOS/vulkansdk-macOS-* --root "$HOME/VulkanSDK" --accept-licenses --default-answer --confirm-command install com.lunarg.vulkan.core
          dxcBin="$HOME/VulkanSDK/macOS/bin/dxc"
          test -x "$dxcBin"
          echo "$(dirname "$dxcBin")" >> "$GITHUB_PATH"
          "$dxcBin" --version

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_OSX_DEPLOYMENT_TARGET=26.0

      - name: Build shader compiler
        run: cmake --build build --target shader-compiler --config Debug --parallel

      - name: Compile Metal shaders
        run: |
          shader_compiler="$(find build -type f -name shader-compiler -perm -111 -print -quit)"
          test -n "$shader_compiler"
          "$shader_compiler" --config tools/ShaderCompiler/shaders.cfg

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Test
        run: ctest --test-dir build --build-config Debug --output-on-failure
