name: Metal Validation

on:
  push:
    branches:
      - 'agent-validate/**'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore incremental build
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            build
            .built-index
          key: build-${{ github.sha }}
          restore-keys: build-

      # A fresh checkout gives every file a new mtime, which forces a full rebuild.
      # Age all files, then touch only what changed since the cached build.
      - name: Restore source timestamps
        run: |
          git ls-files -z | xargs -0 touch -t 200001010000
          git ls-files -s > "$RUNNER_TEMP/now.idx"
          if [[ -f .built-index ]]; then
            comm -13 <(sort .built-index) <(sort "$RUNNER_TEMP/now.idx") | cut -f2 | xargs -I{} touch "{}"
          else
            git ls-files -z | xargs -0 touch
          fi

      - name: Check vendored DXC
        run: third_party/dxc/macos/bin/dxc --version

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_OSX_DEPLOYMENT_TARGET=26.0

      - name: Build shader compiler
        run: cmake --build build --target shader-compiler --config Debug --parallel

      - name: Compile Metal shaders
        run: |
          shader_compiler="$(find build -type f -name shader-compiler -perm -111 -print -quit)"
          test -n "$shader_compiler"
          "$shader_compiler" --config tools/ShaderCompiler/shaders.cfg

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Test
        run: ctest --test-dir build --build-config Debug --output-on-failure

      - name: Record built commit
        run: git ls-files -s > .built-index

      - name: Upload headless render artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-render
          path: build/artifacts/
          if-no-files-found: warn
