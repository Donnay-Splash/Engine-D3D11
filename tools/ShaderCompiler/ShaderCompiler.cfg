# Shader compiler configuration. Paths are relative to this file.
# Lines are "key = value"; "#" starts a comment.

[settings]
dxc = ../../third_party/dxc/macos/bin/dxc
shaderModel = 6_6
outputDirectory = ../../build/shaders
# Engine program config. It names every shader entry to build; nothing else is compiled.
programs = ../../engine/shaders/ShaderPrograms.cfg
# Directory holding the HLSL sources (<source>.hlsl) and their includes.
includeDirectory = ../../engine/shaders
# Extra arguments for every dxc invocation.
dxcArgs =
