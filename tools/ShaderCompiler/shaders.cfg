# Shader compiler configuration. Paths are relative to this file.
# Lines are "key = value"; "#" starts a comment.

[settings]
dxc = dxc
shaderModel = 6_6
outputDirectory = ../../build/shaders
includeDirectory = ../../engine/shaders
# Extra arguments for every dxc invocation.
dxcArgs =

# One [shader] section per HLSL source file. Each "entry" line is
# "<stage> <entryPoint>" where stage is vs, ps or cs.
[shader]
name = Scene
source = ../../engine/shaders/Scene.hlsl
entry = vs mesh_vertex
entry = ps mesh_fragment
entry = cs fill_values
